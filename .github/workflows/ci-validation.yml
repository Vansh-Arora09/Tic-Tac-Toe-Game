name: Java CI & Docker Delivery Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Test Suite
      run: mvn clean test

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: vansharora09
        password: ${{ secrets.DOCKER_HUB_TOKEN }} # Add your Docker Hub password in GitHub Settings -> Secrets

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: vansharora09/tictactoe-pipeline-game:latest
