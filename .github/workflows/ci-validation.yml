name: Java CI & Docker Delivery Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: 🔁 Checkout Source Code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17 (Eclipse Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: 🧪 Run Unit Test Suite with Maven
      run: mvn clean test

    - name: 🐳 Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: vansharora09
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: 📦 Build and Push Optimized Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          vansharora09/tictactoe-pipeline-game:latest
          vansharora09/tictactoe-pipeline-game:${{ github.run_number }}
